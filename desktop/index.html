<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>GitJournal</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <p id="status" role="status" aria-live="polite"></p>
    <main>
      <h1 id="title">Journal de travail</h1>
      <p id="subtitle">
        Ouvrez un projet .gitj ou créez un projet à la racine de votre dépôt.
      </p>
      <div class="journal-actions" role="group" aria-label="Actions du journal">
        <button type="button" id="add" hidden>+ Ajouter une entrée</button>
        <button
          type="button"
          id="journal-stats"
          class="journal-icon-button"
          aria-label="Statistiques"
          title="Statistiques"
        >
          <span class="journal-icon-chart" aria-hidden="true"></span>
        </button>
        <button
          type="button"
          id="journal-help"
          class="journal-icon-button"
          aria-label="Aide"
          title="Aide"
        >
          <span aria-hidden="true">?</span>
        </button>
      </div>
      <div
        id="journal"
        role="region"
        aria-label="Tableau du journal"
        tabindex="0"
      ></div>
      <p class="version">GitJournal 4.1.1</p>
    </main>
    <dialog id="modal">
      <form id="form">
        <h2 id="dialog-title"></h2>
        <div id="fields"></div>
        <p id="form-error" role="alert"></p>
        <footer>
          <button type="button" id="cancel">Annuler</button
          ><button type="submit" id="submit">Enregistrer</button>
        </footer>
      </form>
    </dialog>
  </body>
</html>
