[package]
name = "gitjournal-desktop"
version = "4.1.1"
edition = "2021"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
gitjournal-core = { path = "../crates/journal-core" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
dirs = "6"
uuid = { version = "1", features = ["v4"] }
webbrowser = "1"
printpdf = { version = "0.8", default-features = false }
fontdb = "0.23"
ttf-parser = "0.25"

[dev-dependencies]
tempfile = "3"
